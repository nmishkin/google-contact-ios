name: GoogleContacts
options:
  bundleIdPrefix: com.mishkin
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  GoogleContactsKit:
    path: Packages/GoogleContactsKit
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
targets:
  GoogleContacts:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources: [App/GoogleContacts]
    scheme:
      testTargets:
        - GoogleContactsUITests
    settings:
      base:
        # Only real-device (iphoneos SDK) builds need a team/profile; leave the macOS build's
        # existing ad-hoc "Sign to Run Locally" signing (used by build-and-install.sh) untouched.
        "DEVELOPMENT_TEAM[sdk=iphoneos*]": U8A99RW79V
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
    info:
      path: App/GoogleContacts/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "${GOOGLE_REVERSED_CLIENT_ID}"
        GIDClientID: "${GOOGLE_CLIENT_ID}"
    entitlements:
      path: App/GoogleContacts/GoogleContacts.entitlements
      properties: {}
    postBuildScripts:
      - name: Set CFBundleVersion from git commit count
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          build_number=$(git -C "$SRCROOT" rev-list --count HEAD)
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build_number" "$plist"
    dependencies:
      - package: GoogleContactsKit
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
  GoogleContactsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App/GoogleContactsUITests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: GoogleContacts_iOS
    dependencies:
      - target: GoogleContacts_iOS
